[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-onebot"
version = "0.1.2"
description = "A OneBot v11 implementation in Python, based on lagrange-python"
readme = "readme.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "HarcicYang" },
]
keywords = ["onebot", "qq", "lagrange"]
dependencies = [
    "pydantic",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-multipart",
    "httpx",
    "lagrange-python @ git+https://github.com/HarcicYang/lagrange-python.git",
    "aiosqlite",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["euleronebot*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: `import *` is intentional, names are resolved via `__all__`
"src/euleronebot/onebot/__init__.py" = ["F403", "F405"]
"src/euleronebot/onebot/api.py" = ["F403", "F405"]
"src/euleronebot/protocol/impl.py" = ["F403", "F405"]
# Intentional Chinese UI strings use fullwidth punctuation
"src/euleronebot/config.py" = ["RUF001"]
"src/euleronebot/utils/infomgr.py" = ["RUF001"]

[tool.pyrefly.errors]
bad-override-mutable-attribute = false


[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyrefly>=0.60.0",
    "nuitka>=4.1.3",
]
