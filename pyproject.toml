[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-onebot"
version = "0.0.3"
description = "A OneBot v11 implementation in Python, based on lagrange-python"
readme = "readme.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "HarcicYang" },
]
keywords = ["onebot", "qq", "lagrange"]
dependencies = [
    "pydantic",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "qrcode>=8.2",
    "cryptography>=49.0.0",
    "lagrange-python @ git+https://github.com/LagrangeDev/lagrange-python.git",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["euleronebot*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: `import *` is intentional, names are resolved via `__all__`
"src/euleronebot/onebot/__init__.py" = ["F403", "F405"]
"src/euleronebot/onebot/api.py" = ["F403", "F405"]
"src/euleronebot/protocol/impl.py" = ["F403", "F405"]
# Intentional Chinese UI strings use fullwidth punctuation
"src/euleronebot/config.py" = ["RUF001"]
"src/euleronebot/utils/infomgr.py" = ["RUF001"]

[tool.pyright]
pythonVersion = "3.11"
reportIncompatibleVariableOverride = false
extraPaths = ["./src"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
