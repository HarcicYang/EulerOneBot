name: Lint, Type Check & Test

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: uvx ruff@0.16.1 check .

      - name: Ruff format check
        run: uvx ruff@0.16.1 format --check .

      - name: Install dependencies
        run: uv sync

      - name: Pyrefly type check
        run: uv run pyrefly check

      - name: Run tests
        run: uv run pytest
